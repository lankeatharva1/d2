[nosetests]
verbosity=2
with-spec=1
spec-color=1
with-coverage=1
cover-erase=1
cover-package=service
cover-html=1
cover-html-dir=.coverage_html

[coverage:report]
show_missing = True

[flake8]
max-line-length=100
exclude = .git,__pycache__,.tox,venv

[pylint]
max-line-length=100
disable=C0114,C0115,C0116
